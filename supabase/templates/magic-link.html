<h2>Your sign-in link</h2>

<p>Follow the link below to sign in. This link expires shortly and can only be used once.</p>

<!--
  The link goes to this application, not to the auth service.

  Supabase's own {{ .ConfirmationURL }} sends the buyer through the auth
  service's /verify endpoint, which hands the session back in the URL FRAGMENT.
  A fragment is never sent to a server, so src/app/auth/callback/route.ts sees
  no token, and the buyer lands on the sign-in page being told their link did
  not work. One tap after paying, and their claim is dropped.

  {{ .RedirectTo }} is the callback URL the app asked for, already carrying
  ?next= with the claim it is in the middle of. The token is appended with &,
  which is why src/lib/auth/destination.ts always emits a query string.
-->
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}">Sign in</a></p>
