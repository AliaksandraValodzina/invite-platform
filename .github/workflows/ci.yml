# The pull request gate.
#
# Owned by one task at a time. If another task needs CI to do something new,
# send the requirement rather than editing this file. Two tasks editing one
# workflow produces runs nobody can attribute.
#
# The `database` job at the bottom is the one the Phase 0.1 scaffolding left a
# worked example for, filled in by the stage 1 read path task, which is the
# first work in this repo that reads a row.
#
# Two properties this file is built around, both of which have tests:
#
#   1. `CI gate` is the single required status check, and it fails closed. A job
#      that was skipped when it should have run makes it red. See
#      .github/scripts/ci-gate.sh and its tests.
#   2. This repo is private, so Actions minutes are metered and GitHub rounds
#      every job up to a whole minute. Job count is therefore a direct cost, and
#      the expensive work is skipped when it cannot tell us anything.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a Node release cannot change the result of a green run.
  NODE_VERSION: '24.10.0'

jobs:
  # Also decides whether Playwright needs to run. That decision used to live in
  # a job of its own, which was correct but cost a full billed minute for about
  # fifteen seconds of work, because of the per job rounding. Folding it in here
  # saves a minute on every pull request. The trade is that Playwright now waits
  # for the checks below instead of starting alongside them, which costs wall
  # clock but not money, and means a pull request that fails lint never pays for
  # a browser run it was never going to reach.
  static:
    name: typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          # Full history, so the diff can be taken from the merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test

      # The gate decides whether a pull request can merge, so its logic is
      # tested like anything else. No dependencies beyond jq, which the runner
      # already has, so it adds no measurable time to this job.
      - name: Test the CI gate logic
        run: bash .github/scripts/ci-gate.test.sh

      - name: Decide whether Playwright can exercise this diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request, so the full suite runs."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from the merge base, not the base tip. Diffing the tip also
          # picks up commits that landed on main after this branch was cut,
          # which would run Playwright for changes that are not ours.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$merge_base" "$HEAD_SHA")

          echo "Merge base: $merge_base"
          echo "Changed files:"
          echo "$changed"

          # An empty diff matches nothing, which the filter below would read as
          # "skip". That is the one shape where a filter bug hides a regression,
          # so an empty diff runs Playwright rather than trusting the filter.
          if [ -z "$changed" ]; then
            echo "Empty diff, running Playwright rather than trusting the filter."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that can alter rendered output, routing, the build, or the
          # browser suite itself. Docs, unit tests and lint config are excluded
          # on purpose, because the steps above already cover them.
          if echo "$changed" | grep -Eq '^(src/|public/|templates/|supabase/|scripts/|tests/e2e/|tests/support/|playwright\.config\.ts$|next\.config\.ts$|postcss\.config\.mjs$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "Playwright will run."
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "Playwright skipped: no file it can exercise changed."
          fi

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "static finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: playwright smoke
    needs: static
    if: ${{ needs.static.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # No Supabase project and no Vercel link exist yet, so the build runs with
      # no service variables set. That is the state it has to succeed in.
      - name: Build
        run: npm run build

      # Downloading chromium is the single most expensive step in the whole
      # gate. Measured locally at 113s cold against 3s warm, which on a metered
      # private repo is worth about two billed minutes per run. The key is the
      # lockfile hash, so pinning a new Playwright invalidates it automatically.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only chromium, and deliberately without `--with-deps`.
      #
      # The first green run measured this step at 299s, which was 88% of the
      # whole job. Almost all of that is the apt-get work that `--with-deps`
      # does, not the browser download, which is about 110s. Runners are
      # ephemeral, so apt cannot be cached: `install-deps` would pay that cost
      # again on every run, cache hit or not.
      #
      # The ubuntu-latest image already carries the shared libraries chromium
      # links against, so the deps install is redundant here. If that ever stops
      # being true the smoke tests fail immediately and loudly at browser
      # launch, which is the right way to find out, and the fix is to restore
      # `--with-deps` on this line.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # The browser suite reads real rows now: it walks all four serving states
      # from `public.event_state_at`, and it seeds them through the same script
      # the captain runs by hand. Everything before this step runs without any
      # of it, which is what keeps the build's own claim true.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # Only the containers something here talks to. The suite needs Postgres,
      # PostgREST and the auth API to seed an owner; realtime, storage, studio,
      # analytics and the rest are images to pull for no assertion.
      - name: Start the local Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # The CLI's local keys are its well known development ones, published in
      # Supabase's own documentation. They are not secrets and no hosted value
      # appears anywhere in this workflow.
      - name: Point the suite at that stack
        run: |
          set -euo pipefail
          status=$(supabase status -o json)
          {
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
            # The publishable key. The suite signs a buyer in and reads their
            # dashboard as them, which is the path row level security actually
            # guards, so the sign-in half needs the key a browser would carry.
            echo "SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
          } >> "$GITHUB_ENV"

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "e2e finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  # Postgres, the migrations, and the two proofs that only a real database can
  # give: the pgTAP suite, which switches role inside a transaction, and the
  # anonymous probe, which goes through PostgREST and the auth API the way an
  # attacker would. They are not the same claim. A stray grant, a policy written
  # without a `to authenticated` clause, or a table exposed through a view would
  # pass one and fail the other.
  #
  # Unfiltered on purpose. A database job that only runs when `supabase/`
  # changed misses the case that matters most: application code that starts
  # reading a table it should not be able to reach.
  #
  # Cost: this pulls and starts containers, so budget one to two billed minutes
  # per pull request on top of what was here before, and the same again inside
  # `e2e`, which needs a database for the same reason. Folding the two together
  # would save that second start and cost the ability to tell a schema failure
  # from a rendering one at a glance. Worth revisiting if the bill bites.
  database:
    name: migrations, policies and RLS
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No `npm ci`. scripts/check-anon-access.mjs has no dependencies and reads
      # its credentials from `supabase status`, so this job never installs the
      # application's package tree.
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # `supabase start` applies every migration in supabase/migrations to a
      # database created from nothing, which is the only way to know they still
      # apply in order to an empty one.
      - name: Start the local Supabase stack, applying every migration
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run the pgTAP suite
        run: supabase test db

      # An RLS test that only asserts an allowed read passes against a table
      # with RLS switched off entirely. This one asserts the denials, against
      # rows it seeded through the service role first, so every "cannot read" is
      # a denial rather than an empty database.
      - name: Prove an anonymous client is still denied
        run: node scripts/check-anon-access.mjs

      # Runs last, and it has to. It adds an enum value, which cannot be rolled
      # back, so it leaves a sixth RSVP question type behind on whatever
      # database it ran against. That is free here, because the stack is thrown
      # away with the runner, and it is why the script refuses to run against
      # anything but a local database.
      #
      # What it buys: the claim that a sixth question type is an addition rather
      # than a migration is the load bearing one in the reply model, and this
      # performs it against a database already holding answers and then reads
      # the catalogue to show that no table and no row was rewritten. It costs
      # about a second on top of a job that has already started the containers.
      - name: Prove a sixth RSVP question type needs no migration
        run: node scripts/prove-question-type-addition.mjs

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "database finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  # The single required status check. Set branch protection to require this and
  # nothing else: requiring `playwright smoke` directly would block every pull
  # request where it is legitimately skipped.
  #
  # It is handed the whole `needs` context rather than a hand written list of
  # job names, so a job added to `needs` is required to succeed from the moment
  # it is added. Exempting one takes a deliberate CONDITIONAL_JOBS entry, which
  # is the difference between failing closed and failing open.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [static, e2e, database]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # Unconditional. A gate whose failure depends on an `if:` expression
      # evaluating correctly is a gate that passes when the expression is wrong.
      - name: Check every job against the decision that was made
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Every job named here is allowed to be skipped, but only when its
          # decision says so. Everything else must succeed.
          CONDITIONAL_JOBS: |
            e2e=${{ needs.static.outputs.e2e }}
        shell: bash
        run: |
          # pipefail, because the default shell is `bash -e` without it and the
          # pipe would hand the step tee's exit code instead of the gate's.
          set -o pipefail
          bash .github/scripts/ci-gate.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs even when the gate above went red, so a failing run still reports
      # what it cost. A later step succeeding does not clear an earlier failure,
      # so this cannot turn a red gate green.
      #
      # GitHub rounds every job up to a whole minute, so the billed column, not
      # the wall clock column, is what the bill is made of. Skipped jobs are free.
      - name: Report what this run cost
        if: ${{ always() }}
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          STATIC_SECONDS: ${{ needs.static.outputs.duration }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_SECONDS: ${{ needs.e2e.outputs.duration }}
          DATABASE_RESULT: ${{ needs.database.result }}
          DATABASE_SECONDS: ${{ needs.database.outputs.duration }}
        shell: bash
        run: |
          set -uo pipefail

          gate_seconds=$(( $(date +%s) - JOB_START ))
          total=0

          row () { # name result seconds
            local name=$1 result=$2 seconds=${3:-} mins shown
            if [ "$result" = "skipped" ]; then
              echo "| $name | skipped | not run | 0 |"
              return
            fi
            # A job that died before its reporting step leaves this empty, so
            # say so rather than printing a confident zero.
            if [ -z "$seconds" ]; then shown="unknown"; else shown="${seconds}s"; fi
            mins=$(( ( ${seconds:-0} + 59 ) / 60 ))
            total=$(( total + mins ))
            echo "| $name | $result | $shown | $mins |"
          }

          {
            echo "## What this run cost"
            echo ""
            echo "| Job | Result | Wall clock | Billed minutes |"
            echo "| --- | --- | --- | --- |"
            row "static"   "$STATIC_RESULT"   "$STATIC_SECONDS"
            row "e2e"      "$E2E_RESULT"      "$E2E_SECONDS"
            row "database" "$DATABASE_RESULT" "$DATABASE_SECONDS"
            row "gate"     "success"          "$gate_seconds"
            echo ""
            echo "**Total billed: ${total} minute(s).**"
            echo ""
            echo "GitHub rounds each job up to a whole minute, so short jobs are not cheap ones. Skipped jobs are not billed."
          } >> "$GITHUB_STEP_SUMMARY"

# ---------------------------------------------------------------------------
# What the database job cost, and what it bought
# ---------------------------------------------------------------------------
#
# The worked example that used to sit here has been built as the `database` job
# above. It differs from the sketch in one way worth recording: it starts the
# Supabase CLI's stack rather than a bare `postgres:17` service container.
#
# The reason is the migrations. They reference `auth.users`, the `anon`,
# `authenticated` and `service_role` roles, `pg_cron` and pgTAP, none of which
# exist in the stock Postgres image, so a service container would need a
# hand written shim standing in for Supabase. A shim that drifts from the real
# thing turns a green migration run into a claim about the shim. Two of the
# three things the sketch said to get right still hold exactly as written:
# `database` is in the gate's `needs` with no CONDITIONAL_JOBS entry, so it must
# succeed; and the containers are billed to the job that starts them.
