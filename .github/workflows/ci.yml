name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Node release cannot change the result of a green run.
  NODE_VERSION: '24.10.0'

jobs:
  # This repo is private, so Actions minutes are metered. Playwright is the
  # expensive job because it pays for a build and a browser download before it
  # runs a single assertion, so it is skipped on pull requests that cannot
  # possibly change what it exercises. Pushes to main always run it.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether Playwright can exercise this diff
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request, running the full suite."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from the merge base, not from the base tip. Diffing against the
          # tip also picks up commits that landed on main after this branch was
          # cut, which would run Playwright for changes that are not ours.
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$merge_base" "$HEAD_SHA")

          echo "Merge base: $merge_base"
          echo "Changed files:"
          echo "$changed"

          # An empty diff matches nothing, which the filter below would read as
          # "skip". That is the one shape where a filter bug hides a regression,
          # so an empty diff runs Playwright rather than trusting the filter.
          if [ -z "$changed" ]; then
            echo "Empty diff, running Playwright rather than trusting the filter."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that can alter rendered output, routing, the build, or the
          # browser suite itself. Docs, unit tests and lint config are excluded
          # on purpose: they are already covered by the static job.
          if echo "$changed" | grep -Eq '^(src/|public/|tests/e2e/|playwright\.config\.ts$|next\.config\.ts$|postcss\.config\.mjs$|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            echo "Playwright will run."
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "Playwright skipped: no file it can exercise changed."
          fi

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "changes finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  static:
    name: typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test

      # The gate decides whether a pull request can merge, so its logic is
      # tested like anything else. No dependencies, so it adds no measurable
      # time to this job.
      - name: Test the CI gate logic
        run: bash .github/scripts/ci-gate.test.sh

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "static finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: playwright smoke
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # No Supabase project and no Vercel link exist yet, so the build runs with
      # no service variables set. That is the state it has to succeed in.
      - name: Build
        run: npm run build

      # Downloading chromium is the single most expensive step in the whole
      # gate. Measured locally at 113s cold against 3s warm, which on a metered
      # private repo is worth about two billed minutes per run. The key is the
      # lockfile hash, so pinning a new Playwright invalidates it automatically.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only chromium, and only its own dependencies. Installing all three
      # browser engines here would roughly triple the slowest step in the gate.
      - name: Install Playwright browser and OS dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      # The binary came from the cache, but the OS libraries it links against
      # belong to the runner image rather than the cached directory, so they
      # still have to be ensured. This is the cheap path.
      - name: Install Playwright OS dependencies only
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Report job duration
        id: duration
        if: ${{ !cancelled() }}
        run: |
          seconds=$(( $(date +%s) - JOB_START ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "e2e finished in ${seconds}s" >> "$GITHUB_STEP_SUMMARY"

  # Single required status check.
  #
  # It stays green when e2e is deliberately skipped by the path filter, and red
  # in every other case, including the one that matters: e2e skipped when the
  # filter said it was required. Enumerating 'failure' and 'cancelled' cannot
  # catch that, because 'skipped' is neither, so the gate compares the decision
  # the changes job made against what actually happened. See
  # .github/scripts/ci-gate.sh, and ci-gate.test.sh for the cases it refuses.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [changes, static, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # Unconditional. A gate whose failure depends on an `if:` expression
      # evaluating correctly is a gate that passes when the expression is wrong.
      - name: Check every job against the decision that was made
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_DECISION: ${{ needs.changes.outputs.e2e }}
        shell: bash
        run: |
          # pipefail, because the default shell is `bash -e` without it and the
          # pipe would hand the step tee's exit code instead of the gate's.
          set -o pipefail
          bash .github/scripts/ci-gate.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs even when the gate above went red, so a failing run still reports
      # what it cost. A later step succeeding does not clear an earlier failure,
      # so this cannot turn a red gate green.
      #
      # This repo is private, so minutes are metered and GitHub rounds every job
      # up to a whole minute. The billed column, not the wall clock column, is
      # what the bill is made of, and a skipped job costs nothing at all.
      - name: Report what this run cost
        if: ${{ always() }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_SECONDS: ${{ needs.changes.outputs.duration }}
          STATIC_RESULT: ${{ needs.static.result }}
          STATIC_SECONDS: ${{ needs.static.outputs.duration }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_SECONDS: ${{ needs.e2e.outputs.duration }}
        shell: bash
        run: |
          set -uo pipefail

          gate_seconds=$(( $(date +%s) - JOB_START ))
          total=0

          row () { # name result seconds
            local name=$1 result=$2 seconds=${3:-} mins shown
            if [ "$result" = "skipped" ]; then
              echo "| $name | skipped | not run | 0 |"
              return
            fi
            # A job that died before its reporting step leaves this empty, so
            # say so rather than printing a confident zero.
            if [ -z "$seconds" ]; then shown="unknown"; else shown="${seconds}s"; fi
            mins=$(( ( ${seconds:-0} + 59 ) / 60 ))
            total=$(( total + mins ))
            echo "| $name | $result | $shown | $mins |"
          }

          {
            echo "## What this run cost"
            echo ""
            echo "| Job | Result | Wall clock | Billed minutes |"
            echo "| --- | --- | --- | --- |"
            row "changes" "$CHANGES_RESULT" "$CHANGES_SECONDS"
            row "static"  "$STATIC_RESULT"  "$STATIC_SECONDS"
            row "e2e"     "$E2E_RESULT"     "$E2E_SECONDS"
            row "gate"    "success"         "$gate_seconds"
            echo ""
            echo "**Total billed: ${total} minute(s).**"
            echo ""
            echo "GitHub rounds each job up to a whole minute, so four short jobs cost four minutes regardless of how fast they were. Skipped jobs are not billed."
          } >> "$GITHUB_STEP_SUMMARY"
